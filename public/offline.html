<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Offline — TV Time</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        color: #8e8e93;
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #f5c518;
        color: #000;
        font-weight: 800;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.85rem 1.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Reconnect to load your shows and movies.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Offline — TV Time</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem calc(2rem + env(safe-area-inset-bottom, 0px));
        padding-top: env(safe-area-inset-top, 0px);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .icon svg {
        width: 1.6rem;
        height: 1.6rem;
        stroke: rgba(255, 255, 255, 0.75);
      }
      h1 {
        font-size: 1.7rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        margin-top: 1.75rem;
      }
      .btn {
        appearance: none;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.82rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 1rem 1.6rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .primary {
        background: #f5c518;
        color: #000;
      }
      .primary:active {
        transform: scale(0.97);
      }
      .ghost {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .ghost:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 3.9-2.3" />
          <path d="M19 12.9a10 10 0 0 0-3.9-2.3" />
          <path d="M2 8.8a15 15 0 0 1 5.2-2.8" />
          <path d="M22 8.8a15 15 0 0 0-5.2-2.8" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <div class="actions">
        <a class="btn primary" href="/library">Open library</a>
        <button class="btn ghost" type="button" onclick="location.reload()">
          Try again
        </button>
      </div>
    </div>
    <script>
      "use strict";
      /* Minimal fallback: Library owns downloads playback, this page
         only routes there or retries. Auto-retry when back online. */
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
